<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Jaypi</title>
  <meta name="robots" content="noindex">

  <!-- Favicons: sources are favicon.svg and icons/apple-touch-icon.svg -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Absolute path: Vercel serves this page at whatever URL was missing -->
  <link rel="stylesheet" href="/style.css">

  <!-- Same theme logic as index.html, so the saved theme carries over -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
      var theme = saved === 'light' || saved === 'dark' ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* 404-only layout; colours and fonts come from style.css */
    .notfound {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 96px 0 64px;
    }

    .notfound-code {
      font-family: var(--font-mono);
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: var(--label-tracking);
      color: var(--accent);
      margin-bottom: 24px;
    }

    .notfound-title {
      font-size: clamp(44px, 8vw, 96px);
      font-weight: var(--heading-weight);
      letter-spacing: var(--heading-tracking);
      line-height: 1;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .notfound-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 460px;
      margin-bottom: 32px;
    }

    .notfound-text code {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-primary);
      word-break: break-all;
    }
  </style>

  <!-- Vercel Web Analytics (plain HTML method). The script only exists on Vercel
       deployments, so it shows a harmless 404 when the site runs locally. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

  <nav>
    <div class="container">
      <a href="/" class="nav-brand" aria-label="John Paul Laurio, home"><span class="nav-brand-first">John Paul</span> <span class="nav-brand-last">Laurio</span></a>
    </div>
  </nav>

  <main class="notfound">
    <div class="container">
      <p class="notfound-code">404 · PAGE NOT FOUND</p>
      <h1 class="notfound-title">This page got lost somewhere between commits.</h1>
      <p class="notfound-text">
        There's nothing at <code id="missingPath"></code>. It may have moved, or the link has a typo.
      </p>
      <div class="hero-actions">
        <a href="/" class="hero-cta">
          Back to home
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
        <a href="/#projects" class="hero-cta hero-cta--ghost">See my projects <span class="btn-arrow" aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>

  <script>
    // Show the address that wasn't found (textContent, so it can't inject HTML)
    document.getElementById('missingPath').textContent = window.location.pathname;
  </script>

</body>

</html>
