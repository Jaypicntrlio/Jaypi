  <!-- Set the theme BEFORE the page paints (avoids a flash of the wrong theme).
       Saved choice wins; otherwise follow the visitor's system setting. -->
  <script>
    // Lets CSS hide scroll-reveal content only when JS is running
    document.documentElement.classList.add('js');

    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
      var theme = saved === 'light' || saved === 'dark' ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      // Dark is the base theme in style.css, so only light needs the attribute
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    })();
  </script>

  <!-- Vercel Web Analytics (plain HTML method). The script only exists on Vercel
       deployments, so it shows a harmless 404 when the site runs locally. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
